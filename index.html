<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doormat</title>
<meta name="description" content="Doormat helps you check your post. No account, no advertising, no analytics.">
<style>
  :root {
    --bg: #f2f2f7; --surface: #ffffff; --text: #000000; --secondary: #3c3c43b3; --accent: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --surface: #1c1c1e; --text: #ffffff; --secondary: #ebebf5b3; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
  .updated { color: var(--secondary); margin: 0 0 28px; font-size: 15px; }
  h2 {
    font-size: 15px; font-weight: 600; color: var(--secondary);
    margin: 28px 4px 8px;
  }
  section { background: var(--surface); border-radius: 16px; padding: 4px 18px; }
  .point { padding: 14px 0; border-bottom: 0.5px solid #3c3c4333; }
  .point:last-child { border-bottom: 0; }
  .point h3 { font-size: 17px; margin: 0 0 3px; }
  .point p, section > p { margin: 0; color: var(--secondary); }
  section > p { padding: 14px 0; }
  .lead p { color: var(--text); }
  .note { font-size: 15px; }
  a { color: var(--accent); }
  footer { color: var(--secondary); font-size: 13px; margin: 32px 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Doormat</h1>
  <p>Helps you check your post, on iPhone. No account, no advertising, no analytics.</p>
  <p><a href="privacy/">Privacy and terms</a> · <a href="mailto:boltvault@icloud.com">Contact</a></p>
</main>
</body>
</html>
